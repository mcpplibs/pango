# pango — international text layout: itemisation, shaping, line breaking.
#
# The core library. It knows about scripts, bidi, fonts and layout, and it
# knows NOTHING about how to rasterise: that is pangoft2 and pangocairo, which
# are separate members for the same reason gio is separate from glib —
# upstream ships them as separate shared libraries and that is what a consumer
# links.
#
# ─────────────────────────────────────────────────────────────────────────
# WHY A FORK: GENERATORS, NOT LINE COUNT
#
# The same criterion that made cairo (104k lines) a plain descriptor and
# libdisplay-info (2k) a fork. pango has two, and this fork adds a third:
#
#     configure_file         pango-features.h.meson -> pango-features.h
#     gobject/glib-mkenums   pango_headers          -> pango-enum-types.{h,c}
#     (this fork's own)      gen_module()           -> src/pango.cppm
#
# `build.mcpp` is a compiled C++ program, so the tree carries no `sh` and no
# `python`.
#
# ─────────────────────────────────────────────────────────────────────────
# ⚠️ THIS IS THE PACKAGE THAT WAS BLOCKED ON gio
#
# `PangoFontMap` implements `GListModel`, which lives in gio. The index said so
# for a while, under a reason that turned out to be wrong — see gnome.gio.
[package]
namespace   = "gnome"
name        = "pango"
version     = "1.56.1"
standard    = "c++23"
description = "Pango 1.56.1 — international text layout: itemisation, shaping, bidi and line breaking"
license     = "LGPL-2.1-or-later"
repo        = "https://gitlab.gnome.org/GNOME/pango"

[build]
sources = [
    "../../upstream/pango/break.c",
    "../../upstream/pango/ellipsize.c",
    "../../upstream/pango/fonts.c",
    "../../upstream/pango/glyphstring.c",
    "../../upstream/pango/itemize.c",
    "../../upstream/pango/modules.c",
    "../../upstream/pango/pango-attributes.c",
    "../../upstream/pango/pango-bidi-type.c",
    "../../upstream/pango/pango-color.c",
    "../../upstream/pango/pango-context.c",
    "../../upstream/pango/pango-coverage.c",
    "../../upstream/pango/pango-emoji.c",
    "../../upstream/pango/pango-engine.c",
    "../../upstream/pango/pango-fontmap.c",
    "../../upstream/pango/pango-fontset.c",
    "../../upstream/pango/pango-fontset-simple.c",
    "../../upstream/pango/pango-glyph-item.c",
    "../../upstream/pango/pango-gravity.c",
    "../../upstream/pango/pango-item.c",
    "../../upstream/pango/pango-language.c",
    "../../upstream/pango/pango-layout.c",
    "../../upstream/pango/pango-markup.c",
    "../../upstream/pango/pango-matrix.c",
    "../../upstream/pango/pango-renderer.c",
    "../../upstream/pango/pango-script.c",
    "../../upstream/pango/pango-tabs.c",
    "../../upstream/pango/pango-utils.c",
    "../../upstream/pango/reorder-items.c",
    "../../upstream/pango/shape.c",
    "../../upstream/pango/serializer.c",

    # The JSON reader/writer behind pango_layout_serialize(). Vendored from GTK
    # by upstream and listed in `pango_sources`, not a separate library.
    "../../upstream/pango/json/gtkjsonparser.c",
    "../../upstream/pango/json/gtkjsonprinter.c",

    # Generated by THIS member's build.mcpp.
    "include/pango/pango-enum-types.c",
    "src/pango.cppm",
]

include_dirs = [
    # FIRST — the generated tree. pango's sources say `#include
    # <pango/pango-features.h>` and `<pango/pango-enum-types.h>`, and a build
    # program's own include dir is appended AFTER every dependency's.
    "include",
    "../../upstream",
    "../../upstream/pango",
]

cflags = [
    '-DG_LOG_DOMAIN=\"Pango\"',
    "-DG_LOG_USE_STRUCTURED=1",
    "-DPANGO_COMPILATION",
    # Upstream points these at the install prefix. Nothing here installs a
    # pangorc, and pango's own lookup treats absence as "no configuration",
    # which is what a relocatable package wants.
    '-DSYSCONFDIR=\"/etc\"',
    '-DLIBDIR=\"/usr/lib\"',
    "-D_GNU_SOURCE",
    "-Wno-unused-parameter",
    "-Wno-declaration-after-statement",
    "-fPIC",
]

ldflags = ["-lm"]

[lib]
path = "src/pango.cppm"

[targets.pango-1_0]
kind = "lib"

[dependencies]
# ⭐ gio is the dependency this package waited on: PangoFontMap implements
# GListModel, which lives there.
#
# ⚠️ NAME gio ALONE. glib, gobject and gmodule are workspace PATH dependencies
# of gnome.gio, and mcpp rejects a package requested both ways:
#
#     error: dependency 'gnome.gobject' is requested as both a version dep
#            (by 'pango') and a path dep (by 'gnome.gio@2.82.5'). Pick one.
#
# They all arrive transitively, and `import gnome.gio;` re-exports all three.
gnome.gio = "2.82.5"

# Shaping. harfbuzz is not optional in 1.56 — pango calls hb_shape directly.
compat.harfbuzz = "14.3.0"

# The Unicode bidirectional algorithm.
compat.fribidi = "1.0.16"
